[package]
name = "kk-ui-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "kkui-tool"
description = "KK_UI 单色菜单 UI 的 Rust 移植：页式 1 bit 画布 + 页面/菜单/弹窗运行时，画布尺寸由应用给定"

[lib]
name = "kk_ui"

[[bin]]
name = "kkui-tool"
path = "bin/kkui-tool.rs"
required-features = ["tool"]

[[example]]
name = "sim"
required-features = ["sim"]

[features]
cjk-fonts = []
sim = ["dep:eframe", "dep:png"]
tool = ["dep:clap", "dep:image"]

[dependencies]
png = { version = "0.18", default-features = false, optional = true }
eframe = { version = "0.37", default-features = false, features = [
  "x11",
  "glow",
  "wayland",
], optional = true }
clap = { version = "4", default-features = false, optional = true, features = [
  "std",
  "help",
  "usage",
  "derive",
  "error-context",
] }
image = { version = "0.25", default-features = false, optional = true, features = [
  "png",
  "jpeg",
  "webp",
] }

[build-dependencies]
encoding_rs = { version = "0.8", default-features = false, features = [
  "alloc",
] }
