[package]
name = "secondary-screen-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
screen-capture.workspace = true
screen-capture-wayland-wlr.workspace = true
clap = { version = "4.6", features = ["derive"] }
fast_image_resize = { version = "6.0", default-features = false, features = [
  "std",
] }
# libudev 在 nix 上没有现成的头文件，关掉默认特性改用 sysfs 枚举串口
serialport = { version = "4.10", default-features = false }
