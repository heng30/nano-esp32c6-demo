[package]
name = "ili9341-lcd-slint"
version.workspace = true
edition.workspace = true

[dependencies]
esp-hal.workspace = true
esp-rtos.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-alloc.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
critical-section.workspace = true
static_cell.workspace = true
defmt.workspace = true
rtt-target.workspace = true
panic-rtt-target.workspace = true

# 裸机上只能用软件渲染器；单线程模式让 Slint 用 static 而非 thread_local。
slint = { workspace = true, features = [
  "compat-1-2",
  "unsafe-single-threaded",
  "libm",
  "renderer-software",
  "image-pixel-format-rgb565",
] }

ili9341.workspace = true
display-interface.workspace = true
embedded-hal.workspace = true

[build-dependencies]
slint-build.workspace = true
