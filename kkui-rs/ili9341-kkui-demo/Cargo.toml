[package]
name = "ili9341-kkui-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "在 ILI9341 (8080 并口) 上运行 kk-ui-rs 移植版 KK_UI 标准 Demo"

[dependencies]
kk-ui-rs = { path = "../kk_ui_rs" }

esp-hal = { version = "1.2", default-features = false, features = [
  "rt",
  "defmt",
  "unstable",
  "esp32c6",
  "exception-handler",
] }
esp-rtos = { version = "0.4", default-features = false, features = [
  "esp32c6",
  "embassy",
  "defmt",
] }
esp-bootloader-esp-idf = { version = "0.6", default-features = false, features = [
  "esp32c6",
  "defmt",
  "validation",
] }
embassy-executor = { version = "0.10", default-features = false, features = [
  "defmt",
] }
defmt = { version = "1.2", default-features = false }
rtt-target = { version = "0.6", default-features = false, features = ["defmt"] }
panic-rtt-target = { version = "0.2", default-features = false, features = [
  "defmt",
] }

ili9341 = { version = "0.6", default-features = false, features = ["graphics"] }
display-interface = { version = "0.5", default-features = false }
embedded-hal = { version = "1.0", default-features = false }
embedded-graphics-core = { version = "0.4", default-features = false }
