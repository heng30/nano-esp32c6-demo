# rustflags 挂在目标段下：只对 riscv32 生效，宿主 cargo test 不再被塞 esp 链接脚本
[target.riscv32imac-unknown-none-elf]
runner = "probe-rs run --chip=esp32c6"
rustflags = ["-C", "force-frame-pointers", "-C", "link-arg=-Tdefmt.x", "-C", "link-arg=-Tlinkall.x"]

[build]
target = "riscv32imac-unknown-none-elf"

[env]
DEFMT_LOG = "info"
