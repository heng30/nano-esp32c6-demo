[target.riscv32imac-unknown-none-elf]
runner = "probe-rs run --chip=esp32c6"

[build]
target = "riscv32imac-unknown-none-elf"
rustflags = [
  "-C",
  "link-arg=-Tdefmt.x",
  "-C",
  "link-arg=-Tlinkall.x",
  "-C",
  "force-frame-pointers",
]

[env]
DEFMT_LOG = "info"
CPATH = { value = "src/cshim/include", relative = true }
CC_riscv32imac_unknown_none_elf = "riscv32-none-elf-gcc"
AR_riscv32imac_unknown_none_elf = "riscv32-none-elf-ar"
CFLAGS_riscv32imac_unknown_none_elf = "-march=rv32imac -mabi=ilp32 -fno-stack-protector -Os"
