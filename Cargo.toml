[workspace]
resolver = "3"
members = [
  "lib/*",
  "3461BS",
  "1588BS",
  "baike",
  "rainbow",
  "http-ping",
  "bilibili-follower",
  "ble-server",
  "ble-led",
  "qapass-1602a-lcd",
  "openc6-bios-rs",
  "minio-rs",
  "minio-rs/core",
  "ili9341-lcd",
  "ili9341-lcd-slint",
  "ili9341-lcd-lvgl",
  "ili9341-lcd-kkui",
  "ili9341-lcd-secondary-screen",
  "secondary-screen-desktop",
]

exclude = ["esp32c6-top50"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1
incremental = false
overflow-checks = false

# 全部 default-features = false。大部分依赖的特性所有成员一样，写在这里；
# esp-hal / esp-rtos / esp-radio / esp-alloc 各成员差异太大（defmt、wifi vs ble），
# 这里只放公共部分，成员自己用 features 追加——并集会把 WiFi+BLE 整体塞给显示例程。
[workspace.dependencies]
static_cell = { version = "2.1", default-features = false }
critical-section = { version = "1.2", default-features = false }

font8x8 = { version = "0.3", default-features = false }
serialport = { version = "4.10", default-features = false }
smart-leds-trait = { version = "0.3", default-features = false }
display-interface = { version = "0.5", default-features = false }
ili9341 = { version = "0.6", default-features = false, features = ["graphics"] }

kk-ui-rs = { version = "0.1", default-features = false, features = [
  "cjk-fonts",
] }

slint = { version = "1.19", default-features = false }
slint-build = { version = "1.19", default-features = false, features = [
  "default",
] }

embedded-hal = { version = "1.0", default-features = false }
embedded-hal-bus = { version = "0.3", default-features = false }
embedded-io-async = { version = "0.7", default-features = false }
embedded-graphics = { version = "0.8", default-features = false }
embedded-graphics-core = { version = "0.4", default-features = false }
embedded-tls = { version = "0.19", default-features = false, features = [
  "rsa",
] }
embedded-sdmmc = { version = "0.10", default-features = false, features = [
  "defmt-log",
] }

defmt = { version = "1.2", default-features = false }
rtt-target = { version = "0.6", default-features = false, features = ["defmt"] }
panic-rtt-target = { version = "0.2", default-features = false, features = [
  "defmt",
] }

embassy-futures = { version = "0.1", default-features = false }
embassy-sync = { version = "0.8", default-features = false, features = [
  "defmt",
] }
embassy-executor = { version = "0.10", default-features = false, features = [
  "defmt",
] }
embassy-time = { version = "0.5", default-features = false, features = [
  "defmt",
] }
embassy-net = { version = "0.9", default-features = false, features = [
  "tcp",
  "udp",
  "dns",
  "dhcpv4",
  "proto-ipv4",
  "medium-ethernet",
  "defmt",
] }

esp-hal = { version = "1.2", default-features = false, features = [
  "rt",
  "defmt",
  "unstable",
  "esp32c6",
  "exception-handler",
] }
esp-rtos = { version = "0.4", default-features = false, features = [
  "esp32c6",
  "embassy",
  "defmt",
] }
esp-alloc = { version = "0.11", default-features = false, features = [
  "esp32c6",
  "compat",
  "global-allocator",
] }
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = [
  "esp32c6",
  "unstable",
  "defmt",
] }
esp-bootloader-esp-idf = { version = "0.6", default-features = false, features = [
  "esp32c6",
  "defmt",
  "validation",
] }
esp-storage = { version = "0.10", default-features = false, features = [
  "esp32c6",
  "embedded-storage",
] }
esp-hal-smartled = { version = "0.18", default-features = false, features = [
  "esp32c6",
] }

edge-nal = { version = "0.7", default-features = false }
edge-dhcp = { version = "0.8", default-features = false, features = ["io"] }
edge-nal-embassy = { version = "0.9", default-features = false, features = [
  "tcp",
  "udp",
  "proto-ipv4",
  "medium-ethernet",
] }

trouble-host = { version = "0.8", default-features = false, features = [
  "gatt",
  "scan",
  "defmt",
  "derive",
  "security",
  "peripheral",
  "default-packet-pool",
] }

# 构建期把 GB2312 汉字映射到 Unicode，给 ili9341-lcd 的 build-dependencies 用
encoding_rs = { version = "0.8", default-features = false, features = [
  "alloc",
] }

# embedded-tls 声明的 der 版本是 `0.8.0-rc.2`，解析器会真的挑到那个 rc，而它拉来的 der_derive
# 是 0.8.0 正式版，两边 API 对不上；显式钉一个正式版让 der / der_derive 一致。
der = { version = "0.8.3", default-features = false, features = [
  "oid",
  "time",
  "derive",
  "heapless",
] }

# LVGL 9.6 的 C 源码由 lvgl-rust-sys 构建期编译，需要交叉 C 工具链（见 ili9341-lcd-lvgl/.cargo/config.toml）。
# 配置走本仓自己的 lv_conf.h（`DEP_LV_CONFIG_PATH`），不用它的 vendored config。
lvgl-rust = { version = "0.3", default-features = false, features = [
  "defmt",
  "color_depth_16",
  "use-string-functions",
] }


clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", default-features = false }
memmap2 = { version = "0.9", default-features = false }
spin_sleep = { version = "1.3", default-features = false }
derive_setters = { version = "0.1", default-features = false }
wayland-client = { version = "0.31", default-features = false }
nix = { version = "0.32", default-features = false, features = ["fs"] }
log = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
which = { version = "8.0", default-features = false, features = ["real-sys"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

serde = { version = "1.0", default-features = false, features = [
  "std",
  "derive",
] }
env_logger = { version = "0.11", default-features = false, features = [
  "auto-color",
  "humantime",
] }
fast_image_resize = { version = "6.0", default-features = false, features = [
  "std",
] }
wayland-protocols = { version = "0.32", default-features = false, features = [
  "client",
  "unstable",
] }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = [
  "client",
] }

screen-capture = { path = "lib/screen-capture", features = ["wayland"] }
screen-capture-wayland-wlr = { path = "lib/screen-capture-wayland-wlr" }
